<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#48181e" />
    <meta name="google-site-verification" content="GuFN7WXU0E1TdEMqb2FXdfpmK6bA0p-gdQeN-7z4GjA" />

    <!-- Must run synchronously, before React (or anything else) loads, and
         before the browser applies its own automatic scroll-restoration
         for this history entry. Doing this inside a React useEffect is too
         late — the app has already mounted and painted by then, so the
         browser can briefly jump to a remembered scroll position (often
         showing the footer) right on load before React's own reset takes
         over. Setting it here removes that window entirely. -->
    <script>
      if ('scrollRestoration' in window.history) {
        window.history.scrollRestoration = 'manual';
      }
    </script>

    <!-- Fonts and the API server are connected to as early as possible:
         loading the font CSS from here (not @import inside the app's CSS)
         lets it download in parallel with the app instead of after it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.themiladys.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Marcellus&family=Poppins:wght@400;500;600&display=swap" />

    <title>Milady's — Premium Sarees</title>
    <meta name="description" content="Handpicked silk, pattu and everyday sarees from Milady's, Kakinada — Dharmavaram, Kanjeevaram, Kalamkari, Jamdani and more, delivered across India." />
    <meta name="keywords" content="Milady's sarees, Milady's Kakinada, saree shop Kakinada, sarees online India, Dharmavaram pattu sarees, Kanjeevaram sarees online, pattu sarees online, Kalamkari sarees, Jamdani sarees, party wear sarees, bridal sarees, handloom sarees, sarees Andhra Pradesh" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.themiladys.com/" />

    <!-- Open Graph — this static baseline is what link-preview bots
         (WhatsApp, Facebook, Twitter/X, iMessage) actually see, since
         those don't execute JavaScript. Pages override these once React
         mounts, for crawlers/browsers that do run JS. -->
    <meta property="og:site_name" content="Milady's" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Milady's — Premium Sarees" />
    <meta property="og:description" content="Handpicked silk, pattu and everyday sarees from Milady's, Kakinada — Dharmavaram, Kanjeevaram, Kalamkari, Jamdani and more, delivered across India." />
    <meta property="og:image" content="https://www.themiladys.com/images/model-saree.png" />
    <meta property="og:url" content="https://www.themiladys.com/" />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Milady's — Premium Sarees" />
    <meta name="twitter:description" content="Handpicked silk, pattu and everyday sarees from Milady's, Kakinada — Dharmavaram, Kanjeevaram, Kalamkari, Jamdani and more, delivered across India." />
    <meta name="twitter:image" content="https://www.themiladys.com/images/model-saree.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
