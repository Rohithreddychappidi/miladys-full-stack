<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#48181e" />
    <meta name="google-site-verification" content="GuFN7WXU0E1TdEMqb2FXdfpmK6bA0p-gdQeN-7z4GjA" />

    <!-- Must run synchronously, before React (or anything else) loads, and
         before the browser applies its own automatic scroll-restoration
         for this history entry. Doing this inside a React useEffect is too
         late — the app has already mounted and painted by then, so the
         browser can briefly jump to a remembered scroll position (often
         showing the footer) right on load before React's own reset takes
         over. Setting it here removes that window entirely. -->
    <script>
      if ('scrollRestoration' in window.history) {
        window.history.scrollRestoration = 'manual';
      }
    </script>

    <title>Milady's — Premium Sarees</title>
    <meta name="description" content="Handwoven silks and everyday weaves, sourced directly from India's weaving clusters. Shop Kanjivaram, Banarasi, bridal and organza sarees at Milady's." />
    <meta name="keywords" content="Milady's sarees, Milady's Hyderabad, pure silk sarees online India, Kanjivaram silk saree online, Banarasi silk saree online, pattu sarees online, South Indian bridal sarees, wedding sarees online India, organza sarees online, handloom sarees direct from weavers, sarees Hyderabad, sarees Tirupati" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.themiladys.com/" />

    <!-- Open Graph — this static baseline is what link-preview bots
         (WhatsApp, Facebook, Twitter/X, iMessage) actually see, since
         those don't execute JavaScript. Pages override these once React
         mounts, for crawlers/browsers that do run JS. -->
    <meta property="og:site_name" content="Milady's" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Milady's — Premium Sarees" />
    <meta property="og:description" content="Handwoven silks and everyday weaves, sourced directly from India's weaving clusters. Shop Kanjivaram, Banarasi, bridal and organza sarees at Milady's." />
    <meta property="og:image" content="https://www.themiladys.com/images/model-saree.png" />
    <meta property="og:url" content="https://www.themiladys.com/" />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Milady's — Premium Sarees" />
    <meta name="twitter:description" content="Handwoven silks and everyday weaves, sourced directly from India's weaving clusters. Shop Kanjivaram, Banarasi, bridal and organza sarees at Milady's." />
    <meta name="twitter:image" content="https://www.themiladys.com/images/model-saree.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
